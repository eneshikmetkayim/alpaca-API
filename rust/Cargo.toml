[package]
name = "alpaca-api-client"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for the Alpaca Trading and Market Data APIs"
license = "MIT"
repository = "https://github.com/eneshenderson/alpaca-API"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
